[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Same-origin proxy to the live Render Spring Boot backend.
# The API layer prefers a direct call to Render, but transparently falls back
# to this proxy if a cross-origin request is blocked by the browser.
[[redirects]]
  from = "/api/*"
  to = "https://apexgrid-backend-ejej.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback — every unknown route renders the React app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
